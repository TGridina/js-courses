<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrap">
        <div id="startMenu">
            <h1>Ping Pong</h1>
            <button id="startBtn">Start</button>
            <button id="controlBtn">About</button>
        </div>
        <div id="controlMenu">
            <h1>How to play</h1>
            <div id="text">
                <p>
                    The game is played to 10 points.
                </p>
                <p>
                    The Left player controls the racket using the <b>Shift</b> and <b>Ctrl</b> keys.
                </p>
                <p>
                    The Right player controls the racket using the <b>PgUp</b> and <b>PgDn</b> keys.
                </p>
                <p>
                    Use the <b>Enter</b> key to pause or resume the game.
                </p>
            </div>
            <button id="okBtn">Ok</button>
        </div>
        <div id="pauseMenu">
            <h1>Pause</h1>
            <button id="continueBtn">Continue</button>
            <button id="restartBtn">Restart</button>
        </div>
        <div id="gameOverMenu">
            <h1 id="gameMessage"></h1>
            <button id="againBtn">Play again</button>
        </div>
        <div id="gameplay"></div>
    </div>
    <script type="module">
        import { Ball } from "./ball.js";
        import { Canvas } from "./canvas.js";
        import { PlayerLeft, PlayerRight } from "./player.js";

        let canvas = new Canvas();
        let playerLeft = new PlayerLeft();
        let playerRight = new PlayerRight();
        let ball = new Ball();

        var hitBallAudio = new Audio('hitBall.mp3');

        let startMenu = document.getElementById('startMenu');
        let controlMenu = document.getElementById('controlMenu');
        let pauseMenu = document.getElementById('pauseMenu');
        let gameOverMenu = document.getElementById('gameOverMenu');
        let gameplay = document.getElementById('gameplay');
        let startBtn = document.getElementById('startBtn');
        let controlBtn = document.getElementById('controlBtn');
        let okBtn = document.getElementById('okBtn');
        let continueBtn = document.getElementById('continueBtn');
        let restartBtn = document.getElementById('restartBtn');
        let againBtn = document.getElementById('againBtn');
        let gameMessage = document.getElementById('gameMessage');

        const scoreToWin = 10;
        let gamePaused = false;
        let gameInProgress = false;
        let gameInterval = window.setInterval(function () { });

        window.addEventListener('resize', windowResize);
        startBtn.addEventListener('click', startGame);
        controlBtn.addEventListener('click', showControlMenu);
        okBtn.addEventListener('click', acceptRules);
        continueBtn.addEventListener('click', resumeGame);
        restartBtn.addEventListener('click', resetGame);
        againBtn.addEventListener('click', resetGame);
        document.addEventListener('keydown', keyDown);
        document.addEventListener('keyup', keyUp);

        startMenu.className = 'active';
        pauseMenu.className = '';
        gameplay.className = '';
        gameOverMenu.className = '';
        controlMenu.className = '';

        window.onblur = function () {
            if (gameInProgress) {
                pauseGame();
            }
        }

        function showControlMenu() {
            startMenu.className = '';
            controlMenu.className = 'active';
        }

        function acceptRules() {
            startMenu.className = 'active';
            controlMenu.className = '';
        }

        function startGame() {
            gameInProgress = true;
            gamePaused = false;
            gameplay.className = '';
            startMenu.className = '';
            gameOverMenu.className = '';
            pauseMenu.className = '';
            gameInterval = window.setInterval(function () {
                move();
                drawGame();
            }, 15);
        }

        function resetGame() {
            ball.init();
            playerLeft.init();
            playerRight.init();
            startGame();
        }

        function togglePause() {
            if (gamePaused) {
                resumeGame();
            } else {
                pauseGame();
            }
        }

        function pauseGame() {
            if (!gamePaused) {
                gamePaused = true;
                gameplay.className = '';
                pauseMenu.className = 'active';
                clearInterval(gameInterval);
            }
        }

        function resumeGame() {
            if (gamePaused) {
                gamePaused = false;
                gameplay.className = '';
                pauseMenu.className = '';
                startGame();
            }
        }

        function windowResize() {
            ball.reset();
            playerRight.reset();
            playerLeft.reset();
            canvas.resize();
            if (gameInProgress) {
                drawGame();
            }
        }

        function keyDown(e) {
            if (gameInProgress) {
                e.preventDefault();
                switch (e.keyCode) {
                    case 13:
                        togglePause();
                        break;
                    case 16: //shift
                        playerLeft.upDirection();
                        break;
                    case 17: //ctrl
                        playerLeft.downDirection();
                        break;
                    case 38: //pgup
                        playerRight.upDirection();
                        break;
                    case 40: //pgdn
                        playerRight.downDirection();
                        break;
                }
            }
        }

        function keyUp(e) {
            playerLeft.cleanDirection();
            playerRight.cleanDirection();
        }

        function gameOver() {
            gameInProgress = false;
            clearInterval(gameInterval);
            gameMessage.textContent = '';
            if (playerLeft.isWinner(scoreToWin)) {
                gameMessage.textContent = 'Left Player won!';
            }
            if (playerRight.isWinner(scoreToWin)) {
                gameMessage.textContent = 'Right Player won!'
            }
            gameplay.className = '';
            gameOverMenu.className = 'active';
        }

        function move() {
            ball.moveX();
            if (playerLeft.hasHitBall(ball.x, ball.y, ball.radius) ||
                playerRight.hasHitBall(ball.x, ball.y, ball.radius)) {
                hitBallAudio.play();
                ball.revertSpeedX();
                ball.updateSpeedY(playerRight.y, playerRight.height);
            } else if (playerLeft.hasGoal(ball.x, ball.size)) {
                ball.reset();
                playerRight.increaseScore();
                ball.updateLevel(playerRight.score * .5);
            } else if (playerRight.hasGoal(ball.x)) {
                ball.reset();
                playerLeft.increaseScore();
                ball.updateLevel(playerLeft.score * .5);
            }

            if (playerLeft.isWinner(scoreToWin) || playerRight.isWinner(scoreToWin)) {
                gameOver();
                return;
            }

            ball.moveY();
            playerLeft.move();
            playerRight.move();
        }

        function drawGame() {
            let canvasWidth = canvas.getWidth();
            let canvasHeight = canvas.getHeight();

            canvas.clear();
            canvas.drawCircle(ball.x, ball.y, ball.radius);
            canvas.drawRoundRect(playerLeft.x, playerLeft.y, playerLeft.width, playerLeft.height);
            canvas.drawRoundRect(playerRight.x, playerRight.y, playerRight.width, playerRight.height);
            canvas.drawText(playerLeft.score, canvasWidth * .25, canvasHeight / 2 + 75);
            canvas.drawText(playerRight.score, canvasWidth * .75, canvasHeight / 2 + 75);
            canvas.drawLine(canvasWidth / 2, 0, canvasWidth / 2, canvasHeight);
        }
    </script>
</body>
</html>
